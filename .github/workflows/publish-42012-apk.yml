name: Publicar Rush Launcher 4.20.12 Diagnostic

on:
  push:
    branches: [rush-launcher-42012-release-publish]
    paths:
      - .github/workflows/publish-42012-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperar APK Android con mapa Chile integrado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/14935469932/zip" > artefacto.zip
          mkdir -p extraido
          unzip -q artefacto.zip -d extraido
          FILE=$(find extraido -type f -name '*.apk' -print -quit)
          test -n "$FILE"
          cp "$FILE" RushLauncher-4.20.12-Diagnostico-Integrado-Chile-Offline.apk
          python3 - <<'PY'
          import hashlib, zipfile, os
          p='RushLauncher-4.20.12-Diagnostico-Integrado-Chile-Offline.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert z.getinfo('assets/chile_offline.db').file_size>200000000
              assert 'assets/rush_diagnostic.js' in z.namelist()
              assert 'id="rushDiagScan"' in z.read('assets/index.html').decode()
          digest=hashlib.sha256(open(p,'rb').read()).hexdigest()
          expected='0fe6f2d9077bca6aea6067f1ad66fbab0407cf03d85cbfc2c5ef7a6bf789b8b7'
          print('APK bytes:',os.path.getsize(p),'SHA256:',digest)
          assert digest==expected, 'APK difiere del que verificamos localmente'
          PY

      - name: Publicar descarga directa de APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v4.20.12-diagnostic-integrado \
            RushLauncher-4.20.12-Diagnostico-Integrado-Chile-Offline.apk \
            --repo "$REPO" \
            --target "rush-launcher-42012-diagnostico-integrado" \
            --title "Rush Launcher 4.20.12 - Rush Diagnostic integrado" \
            --notes "APK Android Carlinkit TBox Lite S. Rush Diagnostic es parte del mismo launcher: lectura DTC confirmados/pendientes/permanentes (OBD-II Services 03/07/0A), MIL y readiness (01 01), freeze frame (02), VIN parcial (09), historial local y exportación CSV. Escaneo permitido solo cuando la ECU reporta 0 km/h; no borra ni escribe datos, no accede a ABS/SRS privados. Mantiene TomTom, GPS iPhone, Spotify, luces CAN y mapas offline Chile. Edición de prueba independiente para conservar versiones anteriores por incompatibilidad de firma; no desinstalar hasta comprobar. No se ha probado físicamente con el ELM327/Toyota Rush, servicios ECU pueden no estar soportados." \
            --latest=false
