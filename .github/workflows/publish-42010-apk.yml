name: Publicar Rush 4.20.10 Luces Rapidas

on:
  push:
    branches: [rush-launcher-42010-release-publish]
    paths:
      - .github/workflows/publish-42010-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperar APK compilado y verificado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/14886871559/zip" > artefacto.zip
          mkdir extraido
          unzip -q artefacto.zip -d extraido
          APK=$(find extraido -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" RushLauncher-4.20.10-Luces-Rapidas-Direccionales-Chile-Offline.apk
          python3 - <<'PY'
          import zipfile,hashlib
          path='RushLauncher-4.20.10-Luces-Rapidas-Direccionales-Chile-Offline.apk'
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert archive.getinfo('assets/chile_offline.db').file_size>200000000
              js=archive.read('assets/vehicle_lights.js').decode('utf-8')
              assert 'rushLightCanProfiles' in js and 'indicatorHighAt' in js
          print('SHA256',hashlib.sha256(open(path,'rb').read()).hexdigest())
          PY

      - name: Publicar instalador directo de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v4.20.10-luces-rapidas \
            RushLauncher-4.20.10-Luces-Rapidas-Direccionales-Chile-Offline.apk \
            --repo "$REPO" \
            --target "rush-launcher-42010-faros-rapidos-direccionales" \
            --title "Rush Launcher 4.20.10 - Luces rapidas y direccionales" \
            --notes "APK Android paralelo para Carlinkit TBox Lite S. Luces bajas, altas, intermitentes izquierda/derecha y balizas con efectos SVG. Calibración CAN de 4 fases por circuito; un ELM327/gateway compatible debe exponer realmente la señal. Monitor CAN priorizado con ventanas de 260ms, sin garantía de latencia; conserva mapas Chile offline, GPS iPhone, Spotify y navegación. No modifica luces físicas. Mantén 4.20.9 instalada hasta verificar." \
            --latest=false
