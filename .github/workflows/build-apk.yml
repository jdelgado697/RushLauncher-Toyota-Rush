
name: Compilar APK Toyota Rush

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar JavaScript de la interfaz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("Falta JavaScript de la interfaz")
          Path("/tmp/rush-ui-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/rush-ui-inline.js
          test -f app/src/main/assets/rush_hero.jpg
          test -s app/src/main/assets/rush_turntable.webp
          node --check app/src/main/assets/rush_turntable.js
          grep -q 'id="rushViewHome"' app/src/main/assets/index.html
          grep -q 'id="rushViewGarage"' app/src/main/assets/index.html

      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: RushLauncher-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
