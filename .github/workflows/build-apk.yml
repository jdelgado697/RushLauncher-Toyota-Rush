
name: Compilar APK Toyota Rush

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar interfaz y funciones
        run: |
          node --check app/src/main/assets/dashboard.js
          node --check app/src/main/assets/live_map.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          js=Path("app/src/main/assets/dashboard.js").read_text(encoding="utf-8")
          native=Path("app/src/main/java/cl/rush/launcher/MainActivity.java").read_text(encoding="utf-8")
          manifest=Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          assert '<script src="dashboard.js"></script>' in html
          assert '<script src="live_map.js"></script>' in html
          assert 'id="mapTileLayer"' in html and 'id="mapRecenter"' in html
          assert 'id="mapZoomIn"' in html and 'id="mapZoomOut"' in html
          assert '© OpenStreetMap contributors' in html
          assert 'Representación ilustrativa de un mapa' not in html
          assert 'window.RushLiveMap.updatePosition' in js
          assert 'id="routePanel"' in html
          assert 'data-action="route"' in html
          assert 'Abrir Waze' not in html
          assert 'window.rushDockApps' in js
          assert 'setRealLogo(icon,item.icon)' in js
          assert 'class="dock-label"' in html
          assert '.dockicon.real-icon' in html
          assert 'id="appsList"' in html
          assert 'pngIcon(android.content.pm.ResolveInfo info)' in native
          assert 'info.loadIcon(getPackageManager())' in native
          assert 'window.rushInstalledApps(' in native
          assert 'window.rushDockApps(' in native
          assert 'result.put("icon", image)' in native
          assert 'iconExecutor.execute' in native
          assert 'QUERY_ALL_PACKAGES' not in manifest
          assert 'android.permission.QUERY_ALL_PACKAGES' not in manifest
          assert 'window.Rush.navigate' in js
          assert 'private void openMaps(String destination)' in native
          mapjs=Path("app/src/main/assets/live_map.js").read_text(encoding="utf-8")
          assert 'https://tile.openstreetmap.org/' in mapjs
          assert 'requestAnimationFrame' in mapjs
          assert 'RushLauncher/3.1.0' in native
          assert 'rush_hero.jpg' in html and Path("app/src/main/assets/rush_hero.jpg").stat().st_size>0
          assert 'id="rushClip"' in html
          assert ':root[data-theme=dark] .mapgraphic svg' in html
          assert 'data-theme="light"' in html and 'data-theme=dark' in html
          for item in ['appsPanel','settingsPanel','obdPanel','weatherConsent','musicToggle','songTitle','songArtist']:
              assert 'id="'+item+'"' in html,item
          for func in ['rushSpotifyState','rushInstalledApps','rushPosition','rushWeather']:
              assert 'window.'+func in js,func
          assert 'public void getWeather(double latitude, double longitude)' in native
          assert 'com.spotify.music.metadatachanged' in native
          assert '<uses-permission android:name="android.permission.INTERNET" />' in manifest
          assert 'android.permission.MEDIA_CONTENT_CONTROL' not in manifest
          assert 'NotificationListenerService' not in manifest
          assert 'PlaybackAccessService' not in manifest
          assert 'BIND_NOTIFICATION_LISTENER_SERVICE' not in manifest
          assert 'ACCESSIBILITY' not in manifest
          assert 'MediaSessionManager' not in native
          assert 'requestMediaAccess' not in native
          assert 'requestMediaAccess' not in js
          assert 'id="mediaPermission"' not in html
          assert 'id="musicHelp"' in html
          assert 'AudioManager audio' in native
          assert 'dispatchMediaKeyEvent' in native
          assert not Path("app/src/main/java/cl/rush/launcher/PlaybackAccessService.java").exists()
          assert 'rush_turntable.js' not in html
          print("OK: Rush 3.3.1 sin acceso a notificaciones, logos reales, mapas y controles multimedia")
          PY

      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar manifiesto final de APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E 'PlaybackAccessService|NotificationListenerService|BIND_NOTIFICATION_LISTENER_SERVICE|MEDIA_CONTENT_CONTROL|ACCESSIBILITY_SERVICE'; then
            echo "La APK incluye capacidades sensibles prohibidas."
            exit 1
          fi
          echo "OK: APK sin servicio de lectura de notificaciones"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: RushLauncher-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
