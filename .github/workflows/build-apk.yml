      - name: Probar orden de aplicaciones por categoría
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('app/src/main/assets/app_categories.js', 'utf8'), context);
          const groups = context.window.RushAppCategories;
          assert.strictEqual(groups.sections.map(g => g.id).join(','), 'video,audio,other');
          assert.strictEqual(groups.group({name:'Xuper TV',package:'com.xuper.tv'}),'video');
          assert.strictEqual(groups.group({name:'Xuper Play',package:'com.xuper.play'}),'video');
          assert.strictEqual(groups.isXuper({name:'Xuper TV',package:'com.xuper.tv'}),true);
          assert.strictEqual(groups.isXuper({name:'YouTube',package:'com.google.android.youtube'}),false);
          assert.strictEqual(groups.group({name:'Netflix',package:'com.netflix.mediaclient'}),'video');
          assert.strictEqual(groups.group({name:'YouTube',package:'com.google.android.youtube'}),'video');
          assert.strictEqual(groups.group({name:'Paramount+',package:'com.cbs.app'}),'video');
          assert.strictEqual(groups.group({name:'Prime Video',package:'com.amazon.avod.thirdpartyclient'}),'video');
          assert.strictEqual(groups.group({name:'Fanatiz',package:'com.smartboxtv.nunchee.fanatiz'}),'video');
          assert.strictEqual(groups.group({name:'Basquet Pass',package:'com.adc.basquetpass'}),'video');
          assert.strictEqual(groups.group({name:'Básquet Pass',package:'app.desconocida'}),'video');
          assert.strictEqual(groups.group({name:'Spotify',package:'com.spotify.music'}),'audio');
          assert.strictEqual(groups.group({name:'YouTube Music',package:'com.google.android.apps.youtube.music'}),'audio');
          assert.strictEqual(groups.group({name:'Google Maps',package:'com.google.android.apps.maps'}),'other');
          assert.strictEqual(groups.group({name:'Play Store',package:'com.android.vending'}),'other');
          const sample = [
            {name:'Google Maps',package:'com.google.android.apps.maps'},
            {name:'YouTube',package:'com.google.android.youtube'},
            {name:'Xuper TV',package:'com.xuper.tv'},
            {name:'Xuper Play',package:'com.xuper.play'},
            {name:'Spotify',package:'com.spotify.music'},
            {name:'Netflix',package:'com.netflix.mediaclient'},
            {name:'Paramount+',package:'com.cbs.app'},
            {name:'Fanatiz',package:'com.smartboxtv.nunchee.fanatiz'},
            {name:'Basquet Pass',package:'com.adc.basquetpass'}
          ];
          const categorized = groups.categorize(sample);
          assert.strictEqual(categorized.video.map(x=>x.name).join(','),'Xuper Play,Xuper TV,Basquet Pass,Fanatiz,Netflix,Paramount+,YouTube');
          assert.strictEqual(categorized.audio.map(x=>x.name).join(','),'Spotify');
          assert.strictEqual(categorized.other.map(x=>x.name).join(','),'Google Maps');
          const query = 'netflix';
          const filtered = groups.categorize(sample.filter(x=>x.name.toLowerCase().includes(query)));
          assert.strictEqual(filtered.video.length,1);
          assert.strictEqual(filtered.audio.length,0);
          console.log('OK: Xuper primero entre videos; otros videos, música y otras apps ordenadas.');
          NODE

      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar manifiesto final de APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E 'PlaybackAccessService|NotificationListenerService|BIND_NOTIFICATION_LISTENER_SERVICE|MEDIA_CONTENT_CONTROL|BIND_ACCESSIBILITY_SERVICE|RushNavAccessibilityService|TYPE_ACCESSIBILITY_OVERLAY'; then
            echo "La APK incluye capacidades sensibles prohibidas."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "OK: APK firmada, sin servicios de accesibilidad ni lectura de notificaciones"

      - name: Validar imagen y función HOME en APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/rush_gray.webp > /tmp/rush_gray_bundled.webp
          python3 - <<'PY'
          from pathlib import Path
          img=Path('/tmp/rush_gray_bundled.webp').read_bytes()
          assert img[:4]==b'RIFF' and img[8:12]==b'WEBP' and len(img)>4000
          print('Imagen gris empaquetada:',len(img),'bytes')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q HomeAlias
          echo "HomeAlias incluido en APK"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: RushLauncher-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
