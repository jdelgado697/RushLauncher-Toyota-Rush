name: Publicar APK Rush 4.20.9 OBD CAN

on:
  push:
    branches: [rush-launcher-4209-release-publish]
    paths:
      - .github/workflows/publish-4209-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperar APK Android ya compilado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/14840876884/zip" > artefacto.zip
          mkdir extraido
          unzip -q artefacto.zip -d extraido
          FILE=$(find extraido -type f -name '*.apk' -print -quit)
          test -n "$FILE"
          cp "$FILE" RushLauncher-4.20.9-Faros-OBD-CAN-Chile-Offline.apk
          python3 - <<'PY'
          import zipfile,hashlib,os
          p='RushLauncher-4.20.9-Faros-OBD-CAN-Chile-Offline.apk'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert z.getinfo('assets/chile_offline.db').file_size>200000000
            assert 'window.rushLightCanEvent' in z.read('assets/vehicle_lights.js').decode('utf-8')
          print('APK OK, bytes',os.path.getsize(p))
          print('SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY

      - name: Publicar archivo directo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create v4.20.9-faros-obd-can \
            RushLauncher-4.20.9-Faros-OBD-CAN-Chile-Offline.apk \
            --repo "$REPO" \
            --target "rush-launcher-4209-faros-obd-can" \
            --title "Rush Launcher 4.20.9 - Faros y luces OBD CAN" \
            --notes "Android Carlinkit TBox Lite S. Efectos visuales de faros delanteros, neblineros y pilotos traseros. Modos OBD (requiere calibración CAN experimental), noche, ON y OFF. OBD estándar NO tiene PID de faros y no se garantiza que el gateway Toyota transmita este dato por ELM327. Base nacional Chile offline 276 MiB incluida. Instalar como app paralela, no elimina Rush 4.20.8." \
            --latest=false
