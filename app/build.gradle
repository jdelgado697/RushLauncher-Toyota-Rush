plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.rush.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.rush.launcher'
        minSdk 26
        targetSdk 32
        versionCode 51
        versionName '4.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Renderizado de mapa vectorial OpenGL dentro de Rush Launcher.
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
}
