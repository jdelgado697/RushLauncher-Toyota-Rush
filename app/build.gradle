plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.rush.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.rush.launcher.obd415'
        minSdk 26
        targetSdk 33
        versionCode 43
        versionName '4.15.2-Conduccion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
}

// Proveedor TLS actualizado mediante Google Play Services cuando está disponible.
// No cambia los certificados de confianza ni permite conexiones inseguras.
dependencies {
    implementation 'com.google.android.gms:play-services-base:18.11.1'
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
}
