plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.rush.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.rush.launcher.obd410'
        minSdk 26
        targetSdk 33
        versionCode 36
        versionName '4.10.0-RutasRespaldo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
}
