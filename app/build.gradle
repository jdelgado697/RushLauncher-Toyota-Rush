plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.rush.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.rush.launcher'
        minSdk 26
        targetSdk 32
        versionCode 4
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
