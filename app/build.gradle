plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.rush.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.rush.launcher.obd47'
        minSdk 26
        targetSdk 32
        versionCode 33
        versionName '4.7.0-Segura'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
}
